# ==============================================================================
# Komplett-Stack (Teil 2 Erweiterung): Open WebUI + SearXNG + 3-Ebenen-Gehirn (mcpo)
# ==============================================================================
# Start:   docker compose -f docker-compose.komplett.yml up -d
# WebUI:   http://localhost:3000
# SearXNG: http://localhost:8081
# TwinAPI: http://localhost:9005/obsidian-twin/docs
# ==============================================================================
name: second-brain-stack

services:
  # 1. Lokale ChatGPT-Weboberfläche (Port 3000) mit vorkonfigurierter SearXNG-Websuche
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - ENABLE_RAG_WEB_SEARCH=True
      - RAG_WEB_SEARCH_ENGINE=searxng
      - RAG_WEB_SEARCH_RESULT_COUNT=5
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>&format=json
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui-data:/app/backend/data
      - ./vault:/workspace/vault:rw
    depends_on:
      - searxng
      - twin-mcp-gateway

  # 2. 100 % Private Metasuchmaschine für Live-Recherchen der lokalen KI (Port 8081)
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./configs/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  # 3. MCP-zu-OpenAPI Brücke für das 3-stufige Obsidian-Gehirn (Port 9005)
  twin-mcp-gateway:
    image: ghcr.io/bumuellp/mcpo:latest
    container_name: twin-mcp-gateway
    restart: unless-stopped
    command: ["--config", "/app/mcp-obsidian-twin.json", "--port", "9005", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:9005:9005"
    volumes:
      - ./configs/mcp-obsidian-twin.json:/app/mcp-obsidian-twin.json:ro
      - /home/clemi/Projekte/LLM/digital-twin-memory:/home/clemi/Projekte/LLM/digital-twin-memory:rw
    security_opt:
      - no-new-privileges:true

volumes:
  open-webui-data:
